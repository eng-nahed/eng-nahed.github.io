:root{--blue:#076FEC;--navy:#053FAD;--orange:#FF7E1C;--yellow:#FFD600;--sky:#05ABFF;--cream:#FFF6E2;--ink:#053FAD;
--u:clamp(3px,min(1.1vw,1.4vh),14px);--gbTop:calc(var(--u)*6.4);--gbBot:calc(var(--u)*4.6)}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--gbTop) + 12px)}
body{font-family:'Baloo Bhaijaan 2','Rubik','Amiri',sans-serif;font-weight:600;background:#fff;color:var(--ink);padding-top:var(--gbTop);padding-bottom:var(--gbBot);font-variant-numeric:lining-nums;font-size:18px;line-height:1.85;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.gb-top{position:fixed;top:0;left:0;right:0;z-index:40;height:var(--gbTop);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*2);background:#076FEC;box-shadow:0 calc(var(--u)*.4) 0 #FFD600}
.gb-pill{border:calc(var(--u)*.3) solid #FFD600;background:#076FEC;border-radius:999px;padding:calc(var(--u)*.4) calc(var(--u)*1.8);color:#fff;font-weight:800;font-size:calc(var(--u)*2.6);text-shadow:0 calc(var(--u)*.15) 0 rgba(0,0,0,.25);white-space:nowrap}
.gb-pill b{color:#FFD600;font-weight:800}
.gb-bot{position:fixed;bottom:0;left:0;right:0;z-index:40;height:var(--gbBot);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.5);padding:0 calc(var(--u)*1.5);background:#076FEC;color:#fff;font-weight:700;font-size:calc(var(--u)*2.2);text-align:center}
.gb-bot b{color:#FFD600}
@media(max-width:760px){.gb-bot{font-size:calc(var(--u)*1.9)}}

.wrap{width:min(1080px,94vw);margin:0 auto;padding:22px 0 46px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:800;color:var(--navy);letter-spacing:.3px}
h1,h2,h3{margin:0;font-weight:800}
.hero{background:#076FEC;border:5px solid #FFD600;border-radius:28px;color:#fff;text-align:center;padding:24px 18px}
.hero h1{font-size:clamp(26px,4.4vw,44px);line-height:1.5;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.hero p{margin:6px 0 0;font-size:clamp(16px,2.2vw,22px);color:#FFD600;font-weight:800}
.toc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 6px}
.toc a{background:#05ABFF;color:#fff;text-decoration:none;font-weight:800;border-radius:999px;padding:4px 16px;font-size:16px}
.tools{text-align:center;margin:8px 0 0}
button{font-family:inherit;font-weight:800;cursor:pointer}
.btn{background:#076FEC;color:#fff;border:3px solid #FFD600;border-radius:999px;padding:4px 22px;font-size:17px}
.btn.sky{background:#05ABFF;border-color:#FFD600}
.btn:active{transform:translateY(1px)}

.box{background:var(--cream);border:5px solid var(--orange);border-radius:26px;margin:26px 0;overflow:hidden}
.box.y{border-color:var(--yellow)}
.bh{background:#076FEC;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px}
.bh h2{font-size:clamp(20px,2.6vw,28px);line-height:1.5}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:#FFD600;color:var(--navy);font-weight:800;font-size:24px;display:grid;place-items:center;line-height:1}
.bb{padding:18px 22px}
.bb p{margin:6px 0}
.sub{background:#fff;border:3px solid #FFD600;border-radius:18px;padding:14px 16px;margin:14px 0}
.sub h3{font-size:21px;color:var(--navy);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:3px solid #FF7E1C;border-radius:18px;padding:12px 14px;text-align:center}
.card h3{font-size:20px;color:var(--navy)}
.card .pairs{font-size:16px;margin:2px 0}
.rule{background:#fff;border:3px solid #FF7E1C;border-radius:16px;padding:10px 16px;margin:12px 0}
.tag{display:inline-block;background:#FF7E1C;color:#fff;border-radius:999px;padding:0 14px;font-weight:800;font-size:16px;margin-left:8px;line-height:1.7}
.tag.y{background:#FFD600;color:var(--navy)}
.tag.r{background:#E53935}
.warn{background:#fff;border:3px solid #E53935;border-radius:16px;padding:10px 16px;margin:12px 0}
.fig{text-align:center;margin:8px 0}
.fig svg{width:100%;max-width:440px;height:auto}
.fig.s svg{max-width:330px}
.cap{font-size:15px;color:var(--navy);margin:0 0 4px}
.tw{overflow-x:auto;margin:12px 0}
.tbl{width:100%;border-collapse:separate;border-spacing:0;border:3px solid #FFD600;border-radius:14px;overflow:hidden;background:#fff;min-width:560px}
.tbl th{background:#076FEC;color:#fff;padding:8px 10px;font-weight:800}
.tbl td{padding:8px 10px;border-top:2px solid #FFD600;text-align:center;vertical-align:middle}
.tbl td:first-child{font-weight:800;color:var(--navy)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.step{background:#fff;border:3px solid #FFD600;border-radius:16px;padding:10px 12px}
.pill{display:inline-block;background:#05ABFF;color:#fff;border-radius:999px;padding:0 16px;font-weight:800;margin-bottom:4px}

.lv{display:flex;align-items:center;gap:12px;margin:28px 0 8px}
.lv span{background:#076FEC;color:#fff;border:3px solid #FFD600;border-radius:999px;padding:2px 22px;font-size:22px;font-weight:800}
.lv i{font-style:normal;color:#FF7E1C;font-size:26px;letter-spacing:3px;font-weight:800}
.q{background:#fff;border:4px solid #FFD600;border-radius:20px;padding:14px 18px;margin:16px 0;break-inside:avoid}
.qh{display:flex;gap:12px;align-items:flex-start}
.qn{flex:none;width:40px;height:40px;border-radius:50%;background:#FF7E1C;color:#fff;font-weight:800;font-size:21px;display:grid;place-items:center}
.qt{flex:1;font-size:19px}
.ans{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.ans input{width:150px;font-family:inherit;font-weight:800;font-size:22px;text-align:center;direction:ltr;border:3px solid #FF7E1C;border-radius:12px;padding:2px 8px;background:#fff;color:var(--navy)}
.ans input:focus{outline:3px solid #FFD600}
.fb{font-weight:800;font-size:20px;min-width:140px}
.fb.ok{color:#18A558}.fb.no{color:#E53935}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:right;background:#fff;border:3px solid #FF7E1C;border-radius:14px;padding:4px 14px;font-size:18px;color:var(--ink)}
.opt.ok{background:#18A558;border-color:#18A558;color:#fff}
.opt.no{background:#E53935;border-color:#E53935;color:#fff}
.sol{display:none;background:var(--cream);border:3px solid #FF7E1C;border-radius:14px;padding:8px 14px;margin-top:10px;font-size:17px}
.sol.show{display:block}
.sol b{color:var(--navy)}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0 6px}

/* بذور ثابتة: السؤال نفسه يظهر بكل اللغات */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function withSeed(seed,fn){const o=Math.random;Math.random=mulberry32(seed);try{return fn()}finally{Math.random=o}}
const newSeed=()=>1+Math.floor(Math.random()*2147483000);

function snapState(){const o={y:window.scrollY,pok:Object.assign({},typeof pok!=='undefined'?pok:{}),cards:{}};
  document.querySelectorAll('#content .q[data-k]').forEach(c=>{if(c.classList.contains('iq'))return;
    const ins=[...c.querySelectorAll('input')].map(i=>i.value),sel=[...c.querySelectorAll('.opt')].map(x=>x.classList.contains('ok')?'ok':x.classList.contains('no')?'no':x.classList.contains('sel')?'sel':'');
    const fb=c.querySelector('.fb'),st=fb&&fb.classList.contains('ok')?1:fb&&fb.classList.contains('no')?0:-1,sol=c.querySelector('.sol'),so=sol&&sol.classList.contains('show')?1:0;
    if(ins.some(v=>v)||sel.some(v=>v)||st>=0||so)o.cards[c.dataset.k]={ins,sel,st,so}});
  try{sessionStorage.setItem(SK0+'_snap',JSON.stringify(o))}catch(x){}return o}
function restoreState(){let s=window.__PASS&&window.__PASS.snap||null;try{if(!s)s=JSON.parse(sessionStorage.getItem(SK0+'_snap')||'null');sessionStorage.removeItem(SK0+'_snap')}catch(x){}
  if(!s)return;Object.assign(pok,s.pok||{});
  setTimeout(()=>{Object.keys(s.cards||{}).forEach(k=>{const c=document.querySelector('#content .q[data-k="'+k+'"]');if(!c)return;const d=s.cards[k];
    c.querySelectorAll('input').forEach((i,j)=>{if(d.ins[j]!=null)i.value=d.ins[j]});
    c.querySelectorAll('.opt').forEach((o,j)=>{if(d.sel[j])o.classList.add(d.sel[j])});
    const fb=c.querySelector('.fb');if(fb&&d.st>=0)setFb(fb,!!d.st);
    if(d.so){const so=c.querySelector('.sol');if(so)so.classList.add('show')}});
    window.scrollTo({top:s.y||0,behavior:'instant'})},60)}

  for(let c=1;c<=g.n-1;c++){const v=vals['c'+c];const e=g.carry[c];if(!(v===''||v===undefined)&&+v!==e)return false;if((v===''||v===undefined)&&e!==0)return false}
  return true;
}

function mcS(correct,wrongs,t,sol,lv){const o=shuf([correct].concat(wrongs));return MC(o.indexOf(correct),t,o,sol,{lv})}
function genBank2(n){
  const out=[],u=new Set();
  for(let i=0;i<4;i++){const k=pickUniq(3,10,u);out.push(N(n*k,M(i%2?k+' × '+n+' = ?':n+' × '+k+' = ?'),`${M(n+' × '+k+' = '+n*k)}.`,{lv:1}))}
  u.clear();
  for(let i=0;i<2;i++){const k=pickUniq(3,12,u);out.push(N(k,M(i?'? × '+n+' = '+n*k:n+' × ? = '+n*k),`${M(n+' × '+k+' = '+n*k)}.`,{lv:2}))}
  /* اكتشف الخطأ: ثلاث معادلات صحيحة وواحدة خاطئة */
  {const ks=[];const us=new Set();for(let i=0;i<4;i++)ks.push(pickUniq(3,10,us));
   const bad=rnd(0,3),eq=ks.map((k,i)=>i===bad?M(n+' × '+k+' = '+(n*k+(Math.random()<.5?n:-n))):M(n+' × '+k+' = '+n*k));
   out.push(MC(bad,'أي معادلة من هذه خاطئة؟',eq,`${M(n+' × '+ks[bad]+' = '+n*ks[bad])}، أما المكتوب فيزيد أو ينقص بمقدار ${M(n)} (أخطأ في عدد القفزات).`,{lv:2}))}
  /* صنّف: أي عدد ليس من الجدول */
  {const us=new Set(),ms=[];for(let i=0;i<3;i++)ms.push(n*pickUniq(3,10,us));
   let x,g=0;do{x=n*rnd(3,10)+rnd(1,n-1)}while(ms.includes(x)&&g++<50);
   out.push(mcS(M(x),ms.map(v=>M(v)),`أي عدد من هذه لا يظهر في جدول ${M(n)}؟`,`${M(x)} ليس من مضاعفات ${M(n)}، أما الباقي فنواتج ${M(n)} × عدد صحيح.`,2))}
  /* صح أم خطأ مع السبب */
  {const k=rnd(4,9),isT=Math.random()<.5;
   const st=isT?M(n+' × '+k+' = '+n+' × '+(k-1)+' + '+n):M(n+' × '+k+' = '+n+' × '+(k-1)+' + 1');
   const A='صحيحة: كل مجموعة إضافية تزيد الناتج بمقدار '+M(n),B='خاطئة: كل مجموعة إضافية تزيد الناتج بمقدار '+M(n)+' لا '+M(1),C='خاطئة: الناتج يتضاعف مع كل مجموعة',D='صحيحة: لأن الأعداد متقاربة';
   out.push(MC(isT?0:1,`هل العبارة صحيحة؟ ${st}`,[A,B,C,D],`${M(n+' × '+k+' = '+n+' × '+(k-1)+' + '+n)}: ننتقل من ${M(k-1)} مجموعات إلى ${M(k)} فنضيف مجموعة واحدة حجمها ${M(n)}.`,{lv:2}))}
  /* قارن دون حساب كامل */
  {const a=rnd(5,9),A=M(n+' × '+a),B=M(n+' × '+(a-1)+' + '+(n-1));
   out.push(mcS('الأول أكبر',['الثاني أكبر','متساويان','لا يمكن المقارنة'],`أيهما أكبر (دون حساب كامل): ${A} أم ${B}؟`,`${M(n+' × '+a+' = '+n+' × '+(a-1)+' + '+n)}، والثاني ينقصه ${M(1)}، فالأول أكبر.`,3))}
  /* ترتيب خطوات */
  {const a=rnd(3,8),c=rnd(2,n*a-2);
   out.push(mcS(`نحسب ${M(n+' × '+a)} ثم نطرح ${M(c)}`,[`نطرح ${M(c)} من ${M(a)} ثم نضرب في ${M(n)}`,`نجمع ${M(n+' + '+a)} ثم نطرح ${M(c)}`,`نحسب ${M(n+' × '+c)} ثم نضيف ${M(a)}`],`في كل علبة ${M(n)} أقلام. عندنا ${M(a)} علب وأعطينا ${M(c)} قلماً. ما الترتيب الصحيح لحل المسألة؟`,`نعرف كل الأقلام أولاً: ${M(n+' × '+a+' = '+n*a)}، ثم نطرح ما أُعطي: ${M(n*a+' − '+c+' = '+(n*a-c))}.`,3))}
  /* تفكير عكسي */
  {const k=rnd(3,9),c=rnd(2,9);out.push(N(k,`ضربت عدداً في ${M(n)} ثم أضفت ${M(c)} فصار ${M(n*k+c)}. ما العدد؟`,`نرجع للخلف: ${M((n*k+c)+' − '+c+' = '+n*k)} ثم نقسم على ${M(n)}: <b>${k}</b>.`,{lv:3}))}
  /* أسئلة مباشرة من الجدول بأعداد أكبر */
  {const uq=new Set();
   for(let r=0;r<2;r++){const k=pickUniq(11,15,uq);out.push(N(n*k,M(n+' × '+k+' = ?'),`${M(n+' × '+k+' = '+n*k)}.`,{lv:3}))}
   {const k=pickUniq(11,15,uq);out.push(N(k,M('? × '+n+' = '+n*k),`${M(n+' × '+k+' = '+n*k)}.`,{lv:3}))}
   {const a=rnd(3,8),c=rnd(3,8);out.push(N(n*(a+c),M(n+' × '+a+' + '+n+' × '+c+' = ?'),`${M(n*a+' + '+n*c+' = '+n*(a+c))}.`,{lv:3}))}}
  return out}

const K1=n=>{const [C,I]=pk(NOUNS);return {per:`في كل ${C[0]} ${cntN(n,I)}`,have:a=>`عندنا ${cnt(a,C)}`,total:`كم ${I[3]} عندنا؟`,got:P=>`صار عندنا ${cnt(P,I)}`,miss:`كم ${C[3]} عندنا؟`,u:I,lose:c=>`ثم أعطينا ${cnt(c,I)} لأصدقائنا`,ew:`وزن كل ${C[0]} ${M(3)} كغ`,cl:T=>`عندنا أكثر من ${cnt(T,I)}`}};

const opEq=(K,n)=>{const s=K(n),a=rnd(3,9),P=n*a;return mcS(eqM(n,a,P),[M(n+' + '+a+' = '+(n+a)),eqM(n,a,P+n),eqM(n,a,P-n)],`${s.per}. ${s.have(a)}. ${s.total} أي معادلة تحل المسألة؟`,`كل مجموعة فيها ${M(n)} وعدد المجموعات ${M(a)}، فنضرب: ${eqM(n,a,P)}.`,2)};
const irrel=(K,n)=>{const s=K(n),a=rnd(3,9),P=n*a,A=s.per,B=s.have(a),E=s.ew;return mcS(E,[A,B,'كل المعلومات لازمة'],`${A}. ${B}. ${E}. ${s.total} أي معلومة لا نحتاجها للحل؟`,`للحل نحتاج عدد المجموعات وحجم كل مجموعة فقط: ${eqM(n,a,P)}. أما «${E.replace(/<[^>]*>/g,'')}» فلا تغيّر الجواب.`,3)};
const orderQ=(K,n)=>{const s=pk([K1,K3])(n),a=rnd(3,8),c=rnd(2,n*a-2),P=n*a;return mcS(`نحسب ${M(n+' × '+a)} ثم نطرح ${M(c)}`,[`نطرح ${M(c)} من ${M(a)} ثم نضرب في ${M(n)}`,`نجمع ${M(n+' + '+a)} ثم نطرح ${M(c)}`,`نحسب ${M(n+' × '+c)} ثم نضيف ${M(a)}`],`${s.per}. ${s.have(a)}، ${s.lose(c)}. ${s.total.replace('كم','كم').replace('عندنا؟','بقي؟').replace('ربحنا؟','بقي معنا؟')} ما الترتيب الصحيح للحل؟`,`نعرف المجموع أولاً: ${eqM(n,a,P)}، ثم نطرح: ${M(P+' − '+c+' = '+(P-c))}.`,3)};

  r1+=cell(c<g.n?g.A[g.n-1-c]:'');

}

function vmCheck2(q,vals){
 const g=vmGeom2(q.a,q.b),ok=(r,str)=>{for(let c=0;c<str.length;c++){const v=vals[r+c];if(v===''||v===undefined||+v!==+str[str.length-1-c])return false}return true};

 if(n===102){const a=rnd(21,49),P=a*12,t=Math.floor(a/10)*10,e=a-t;

  if(n===5)return `${M(n+' × '+a)}: نضع صفراً بجانب ${a} فيصير ${M(a*10)} ثم نقسم على 2 ← <b>${P}</b>.`;
  if(n===2)return `${M(n+' × '+a)}: ضعف ${a} هو ${M(a+' + '+a+' = '+P)} ← <b>${P}</b>.`;

function genWords(n,prev){

function wordsHTML(T,tk){
  const key=tk+':wgen';
  if(!T.n&&!T.wg)store[key]=T.words;
  else if(!store[key]){
    const sd=!!T.wg,sk=tk+':wseed';let fresh=true;
    if(sd){if(store[sk])fresh=false;else{store[sk]=newSeed();store[tk+':wprev']=store[tk+':wv']||0}}
    const pv=sd?(store[tk+':wprev']||undefined):store[tk+':wv'];
    const first=!pv;
    const R=sd?withSeed(store[sk],()=>T.wg(pv)):genWords(T.n,store[tk+':wv']);let L=R.slice();
    if(first&&T.seed&&T.seed.length)L=L.slice(0,L.length-T.seed.length).concat(T.seed);
    store[key]=L;store[tk+':wv']=R.idx;
    if(fresh)Object.keys(pok).forEach(k=>{if(k.startsWith(tk+':w:'))delete pok[k]});
  }
  const btn=retryBar(2,!!(T.n||T.wg));
  let h=`<div class="ltitle"><h2>${GN[2]}</h2></div><p class="center">${u('wordsP')}</p>`+btn;

  return h+btn;
}

  const go=()=>{const v=i.value.trim();if(v.length<2){o.querySelector('#nmer').textContent=u('nameErr');return}setPName(v);o.remove()};
  o.querySelector('#nmgo').onclick=go;i.addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>i.focus(),50)}
