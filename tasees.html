:root{--blue:#076FEC;--navy:#053FAD;--orange:#FF7E1C;--yellow:#FFD600;--sky:#05ABFF;--cream:#FFF6E2;--ink:#053FAD;
--u:clamp(3px,min(1.1vw,1.4vh),14px);--gbTop:calc(var(--u)*6.4);--gbBot:calc(var(--u)*4.6)}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--gbTop) + 12px)}
body{font-family:'Baloo Bhaijaan 2','Amiri',sans-serif;font-weight:600;background:#fff;color:var(--ink);padding-top:var(--gbTop);padding-bottom:var(--gbBot);font-variant-numeric:lining-nums;font-size:18px;line-height:1.85;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.gb-top{position:fixed;top:0;left:0;right:0;z-index:40;height:var(--gbTop);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*2);background:#076FEC;box-shadow:0 calc(var(--u)*.4) 0 #FFD600}
.gb-pill{border:calc(var(--u)*.3) solid #FFD600;background:#076FEC;border-radius:999px;padding:calc(var(--u)*.4) calc(var(--u)*1.8);color:#fff;font-weight:800;font-size:calc(var(--u)*2.6);text-shadow:0 calc(var(--u)*.15) 0 rgba(0,0,0,.25);white-space:nowrap}
.gb-pill b{color:#FFD600;font-weight:800}
.gb-bot{position:fixed;bottom:0;left:0;right:0;z-index:40;height:var(--gbBot);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.5);padding:0 calc(var(--u)*1.5);background:#076FEC;color:#fff;font-weight:700;font-size:calc(var(--u)*2.2);text-align:center}
.gb-bot b{color:#FFD600}
@media(max-width:760px){.gb-bot{font-size:calc(var(--u)*1.9)}}

.wrap{width:min(1080px,94vw);margin:0 auto;padding:22px 0 46px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:800;color:var(--navy);letter-spacing:.3px}
h1,h2,h3{margin:0;font-weight:800}
.hero{background:#076FEC;border:5px solid #FFD600;border-radius:28px;color:#fff;text-align:center;padding:24px 18px}
.hero h1{font-size:clamp(26px,4.4vw,44px);line-height:1.5;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.hero p{margin:6px 0 0;font-size:clamp(16px,2.2vw,22px);color:#FFD600;font-weight:800}
.toc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 6px}
.toc a{background:#05ABFF;color:#fff;text-decoration:none;font-weight:800;border-radius:999px;padding:4px 16px;font-size:16px}
.tools{text-align:center;margin:8px 0 0}
button{font-family:inherit;font-weight:800;cursor:pointer}
.btn{background:#076FEC;color:#fff;border:3px solid #FFD600;border-radius:999px;padding:4px 22px;font-size:17px}
.btn.sky{background:#05ABFF;border-color:#FFD600}
.btn:active{transform:translateY(1px)}

.box{background:var(--cream);border:5px solid var(--orange);border-radius:26px;margin:26px 0;overflow:hidden}
.box.y{border-color:var(--yellow)}
.bh{background:#076FEC;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px}
.bh h2{font-size:clamp(20px,2.6vw,28px);line-height:1.5}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:#FFD600;color:var(--navy);font-weight:800;font-size:24px;display:grid;place-items:center;line-height:1}
.bb{padding:18px 22px}
.bb p{margin:6px 0}
.sub{background:#fff;border:3px solid #FFD600;border-radius:18px;padding:14px 16px;margin:14px 0}
.sub h3{font-size:21px;color:var(--navy);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:3px solid #FF7E1C;border-radius:18px;padding:12px 14px;text-align:center}
.card h3{font-size:20px;color:var(--navy)}
.card .pairs{font-size:16px;margin:2px 0}
.rule{background:#fff;border:3px solid #FF7E1C;border-radius:16px;padding:10px 16px;margin:12px 0}
.tag{display:inline-block;background:#FF7E1C;color:#fff;border-radius:999px;padding:0 14px;font-weight:800;font-size:16px;margin-left:8px;line-height:1.7}
.tag.y{background:#FFD600;color:var(--navy)}
.tag.r{background:#E53935}

<script>
const M=s=>`<span class="m">${s}</span>`;
const OR='#FF7E1C',BL='#076FEC',YE='#FFD600',NV='#053FAD';
function box(n,t,b,y){return `<section class="box${y?' y':''}"><div class="bh"><div class="num">${n}</div><h2>${t}</h2></div><div class="bb">${b}</div></section>`}
const R=t=>`<div class="rule"><span class="tag">قاعدة</span>${t}</div>`;
const T=t=>`<div class="rule" style="border-color:#FFD600"><span class="tag y">انتبه</span>${t}</div>`;

/* ---------- الضرب العمودي بمربعات ---------- */
function vmGeom(a,b,op){
  if(op==='+'){const n=Math.max(String(a).length,String(b).length),A=String(a).padStart(n,'0'),B=String(b).padStart(n,'0'),P=String(a+b),m=P.length;
    const carry={};let c=0;for(let i=0;i<n;i++){const v=+A[n-1-i]+(+B[n-1-i])+c;c=Math.floor(v/10);if(i+1<=n-1)carry[i+1]=c}
    const order=[];for(let i=0;i<n;i++){order.push(['a',i]);if(i+1<=n-1)order.push(['c',i+1])}if(m>n)order.push(['a',n]);
    return {A,B,n,P,m,carry,order,op}}
  const A=String(a),n=A.length,P=String(a*b),m=P.length;
  const carry={};let c=0;
  for(let i=0;i<n;i++){const d=+A[n-1-i];const v=d*b+c;c=Math.floor(v/10);if(i+1<=n-1)carry[i+1]=c}
  const order=[];
  for(let i=0;i<n;i++){order.push(['a',i]);if(i+1<=n-1)order.push(['c',i+1])}
  if(m>n)order.push(['a',n]);
  return {A,n,P,m,carry,order};
}
function vmHTML(a,b,key,op){
  const g=vmGeom(a,b,op),n=g.n,cols=n+1;
  const cell=(h)=>`<span class="vc">${h}</span>`;
  const inp=(role,col)=>`<input class="vi ${role==='c'?'cry':''}" data-role="${role}" data-col="${col}" data-ord="${g.order.findIndex(o=>o[0]===role&&o[1]===col)}" maxlength="1" inputmode="numeric" autocomplete="off">`;
  let r1='',r2='',r3='',r4='';
  for(let c=n;c>=0;c--){
    r1+=cell(c>=1&&c<=n-1?inp('c',c):'');
    r2+=cell(c<n?g.A[n-1-c]:'');
    r3+=cell(op==='+'?(c===n?'+':(c<n?g.B[n-1-c]:'')):(c===n?'×':(c===0?b:'')));
    r4+=cell(c<g.m?inp('a',c):'');
  }
  return `<div class="vmx" data-k="${key}"><div class="vrow">${r1}</div><div class="vrow d">${r2}</div><div class="vrow d">${r3}</div><div class="vline"></div><div class="vrow">${r4}</div></div>
   <p class="hint">المربعات الصغيرة فوق الأرقام للتحميل (اتركها فارغة أو اكتب 0 إذا لم يوجد تحميل)</p>`;
}
function vmNav(box,t,dir){
  const q=Qreg[box.dataset.k];if(!q)return null;
  const g=vmGeom(q.a,q.b,q.op),role=t.dataset.role,col=+t.dataset.col;
  const get=(r,c)=>box.querySelector(`.vi[data-role="${r}"][data-col="${c}"]`);
  if(dir>0){
    if(role==='c')return get('a',col);
    if(col+1<=g.n-1&&g.carry[col+1]>0)return get('c',col+1)||get('a',col+1);
    return get('a',col+1);
  }
  if(role==='c')return get('a',col-1);
  if(col>=1){if(col<=g.n-1&&g.carry[col]>0)return get('c',col)||get('a',col-1);return get('a',col-1)}
  return null;
}
function vmRead(box){const o={};box.querySelectorAll('.vi').forEach(i=>o[i.dataset.role+i.dataset.col]=norm(i.value));return o}
function vmCheck(q,vals){
  const g=vmGeom(q.a,q.b,q.op);
  for(let c=0;c<g.m;c++){if((vals['a'+c]===''||vals['a'+c]===undefined)||+vals['a'+c]!==+g.P[g.m-1-c])return false}
  for(let c=1;c<=g.n-1;c++){const v=vals['c'+c];const e=g.carry[c];if(!(v===''||v===undefined)&&+v!==e)return false;if((v===''||v===undefined)&&e!==0)return false}
  return true;
}

/* ---------- محتوى الدروس ---------- */
const LV={1:['المستوى الأول: تثبيت','★'],2:['المستوى الثاني: متوسط','★★'],3:['المستوى الثالث: تحدّي','★★★']};
const N=(ans,t,sol,x)=>Object.assign({type:'num',ans,t,sol},x||{});
const MC=(ans,t,opts,sol,x)=>Object.assign({type:'mcq',ans,t,opts,sol},x||{});
const VA=(a,b,sol)=>({type:'vm',op:'+',a,b,ans:a+b,t:`اكتب الجمع العمودي ${M(a+' + '+b)} في المربعات:`,sol:sol||`الناتج ${M(a+b)}`});
const VM=(a,b,sol)=>({type:'vm',a,b,ans:a*b,t:`اكتب الضرب العمودي ${M(a+' × '+b)} في المربعات:`,sol:sol||`الناتج ${M(a*b)}`});

const TODO=name=>({name,todo:1});
/* ===== كراسة التأسيس: أدوات الرسم والأسئلة (المحاور 1-3) ===== */
const CB='#076FEC',CO='#FF7E1C',CY='#FFD600',CS='#05ABFF',CN='#053FAD',CC='#FFF6E2';
const svg=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="direction:ltr;font-family:inherit">${b}</svg>`;
const circ=(x,y,r,f,s)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${s||CN}" stroke-width="2"/>`;
const txt=(x,y,t,sz,f)=>`<text x="${x}" y="${y}" font-size="${sz||18}" font-weight="800" fill="${f||CN}" text-anchor="middle">${t}</text>`;
const pick=a=>a[rnd(0,a.length-1)];
const plus=(a,b)=>M(a+' + '+b),minus=(a,b)=>M(a+' − '+b);

/* نقاط متناثرة للعدّ */
function scatter(n,col){const cells=[];for(let r=0;r<3;r++)for(let c=0;c<5;c++)cells.push([r,c]);
  let b='';shuf(cells).slice(0,n).forEach(([r,c])=>{b+=circ(26+c*44+rnd(-6,6),24+r*44+rnd(-6,6),15,col||CB)});return svg(240,140,b)}
/* لوحة العشرة: قائمة حالات: b أزرق، o برتقالي، x مشطوب */
function frames(L){const nf=L.length>10?2:1;let b='';
  for(let f=0;f<nf;f++){const x0=8+f*186;b+=`<rect x="${x0}" y="8" width="170" height="68" rx="6" fill="#fff" stroke="${CN}" stroke-width="3"/>`;
    for(let i=1;i<5;i++)b+=`<line x1="${x0+i*34}" y1="8" x2="${x0+i*34}" y2="76" stroke="${CN}" stroke-width="1.5"/>`;
    b+=`<line x1="${x0}" y1="42" x2="${x0+170}" y2="42" stroke="${CN}" stroke-width="1.5"/>`}
  L.forEach((s,i)=>{const f=Math.floor(i/10),p=i%10,r=Math.floor(p/5),c=p%5,cx=8+f*186+c*34+17,cy=8+r*34+17;
    if(s==='x')b+=circ(cx,cy,12,'#fff',CN)+`<path d="M${cx-8} ${cy-8}L${cx+8} ${cy+8}M${cx+8} ${cy-8}L${cx-8} ${cy+8}" stroke="${CO}" stroke-width="3.5" stroke-linecap="round"/>`;
    else b+=circ(cx,cy,12,s==='o'?CO:CB)});
  return svg(nf===2?372:186,84,b)}
const fr=(b,o)=>{const L=[];for(let i=0;i<b;i++)L.push('b');for(let i=0;i<(o||0);i++)L.push('o');return L};
const frx=(t,x)=>{const L=[];for(let i=0;i<t-x;i++)L.push('b');for(let i=0;i<x;i++)L.push('x');return L};
/* مكعبات في صف: جمع (أزرق + برتقالي) أو طرح (مشطوب) */
function bar(a,b,mode){const n=a+b,s=30,g=4;let o='';
  for(let i=0;i<n;i++){const x=6+i*(s+g);
    if(mode==='sub'&&i>=a)o+=`<rect x="${x}" y="8" width="${s}" height="${s}" rx="5" fill="#fff" stroke="${CN}" stroke-width="2.5"/><path d="M${x+6} 14L${x+s-6} ${8+s-6}M${x+s-6} 14L${x+6} ${8+s-6}" stroke="${CO}" stroke-width="3.5" stroke-linecap="round"/>`;
    else o+=`<rect x="${x}" y="8" width="${s}" height="${s}" rx="5" fill="${mode==='sub'||i<a?CB:CO}" stroke="${CN}" stroke-width="2.5"/>`}
  return svg(12+n*(s+g),46,o)}
/* شكل الكل والجزءين */
function bond(w,p1,p2){const B=(x,y,v,f)=>circ(x,y,27,v==='?'?'#fff':f,CN)+txt(x,y+8,v,v==='?'?26:24,v==='?'?CO:'#fff');
  return svg(190,150,`<line x1="95" y1="52" x2="48" y2="94" stroke="${CN}" stroke-width="3"/><line x1="95" y1="52" x2="142" y2="94" stroke="${CN}" stroke-width="3"/>`+B(95,28,w,CB)+B(48,118,p1,CO)+B(142,118,p2,CO))}
/* خط الأعداد مع قفزات */
function nline(lo,hi,hops){const u=30,x0=20,y=96;let b=`<line x1="${x0-8}" y1="${y}" x2="${x0+(hi-lo)*u+8}" y2="${y}" stroke="${CN}" stroke-width="3"/>`;
  for(let v=lo;v<=hi;v++){const x=x0+(v-lo)*u;b+=`<line x1="${x}" y1="${y-6}" x2="${x}" y2="${y+6}" stroke="${CN}" stroke-width="2"/>`+txt(x,y+26,v,14)}
  (hops||[]).forEach((h,i)=>{const a=x0+(h.from-lo)*u,c=x0+(h.to-lo)*u,m=(a+c)/2,top=y-34-Math.abs(c-a)/9,col=i%2?CB:CO,cy=top-24,peak=((y-4)+cy)/2;
    b+=`<path d="M${a} ${y-4} Q${m} ${cy} ${c} ${y-4}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round"/><polygon points="${c},${y-3} ${c-6},${y-15} ${c+6},${y-15}" fill="${col}"/>`+txt(m,peak-8,h.label,17,col)});
  return svg(40+(hi-lo)*u,130,b)}
const FIG=s=>{const m=/viewBox="0 0 (\d+) /.exec(s);if(m&&+m[1]<=330)s=s.replace('style="direction','style="width:100%;max-width:'+m[1]+'px;direction');return `<div class="fig">${s}</div>`};

/* ===== مولّد الأسئلة ===== */
function build(plan){const out=[],seen=new Set();
  plan.forEach(fn=>{let q,t=0,k;do{q=fn();k=plain(q.t)+'|'+q.ans+'|'+(q.opts?q.opts.join(','):'')+(q.k||'');t++}while(seen.has(k)&&t<40);seen.add(k);out.push(q)});return out}
function ds(ans,k,lo,hi){const c=[];for(let d=1;c.length<k&&d<15;d++){[ans+d,ans-d].forEach(v=>{if(v>=lo&&v<=hi&&v!==ans&&!c.includes(v)&&c.length<k)c.push(v)})}return c}
function mcs(correct,wrongs,t,sol,x){const w=[];wrongs.forEach(v=>{if(v!==correct&&!w.includes(v))w.push(v)});
  const opts=shuf([correct].concat(w.slice(0,3)));return MC(opts.indexOf(correct),t,opts,sol,x)}
function numMC(ans,t,sol,lo,hi,x){return mcs(M(ans),ds(ans,3,lo,hi).map(v=>M(v)),t,sol,x)}
function pairs(R){for(let i=0;i<400;i++){const a=rnd(R.a[0],R.a[1]),b=rnd(R.b[0],R.b[1]);if(a+b>=R.s[0]&&a+b<=R.s[1]&&(!R.nc||a%10+b%10<10))return[a,b]}return[R.a[0],R.b[0]]}
function subp(R){for(let i=0;i<400;i++){const a=rnd(R.t[0],R.t[1]),b=rnd(R.b[0],R.b[1]);if(b<=a&&a-b>=(R.d||0)&&(!R.cross||b>a-10)&&(!R.nc||a%10>=b%10))return[a,b]}return[R.t[1],R.b[0]]}

/* أنواع مشتركة */
const qAdd=R=>()=>{const[a,b]=pairs(R);return N(a+b,M(a+' + '+b+' = ?'),`${M(a+' + '+b+' = '+(a+b))}.`,{lv:1})};
const qSub=R=>()=>{const[a,b]=subp(R);return N(a-b,M(a+' − '+b+' = ?'),`${M(a+' − '+b+' = '+(a-b))}.`,{lv:1})};
const qMissAdd=R=>()=>{const[a,b]=pairs(R);return N(b,M(a+' + ? = '+(a+b)),`${M((a+b)+' − '+a+' = '+b)}، ونتأكد: ${M(a+' + '+b+' = '+(a+b))}.`,{lv:2})};
const qMissAdd2=R=>()=>{const[a,b]=pairs(R);return N(a,M('? + '+b+' = '+(a+b)),`${M((a+b)+' − '+b+' = '+a)}، ونتأكد: ${M(a+' + '+b+' = '+(a+b))}.`,{lv:2})};
const qMissSub=R=>()=>{const[a,b]=subp(R);return N(b,M(a+' − ? = '+(a-b)),`${M(a+' − '+b+' = '+(a-b))}، لذلك العدد ${M(b)}.`,{lv:2})};
const qMissSub2=R=>()=>{const[a,b]=subp(R);return N(a,M('? − '+b+' = '+(a-b)),`${M((a-b)+' + '+b+' = '+a)}، لذلك العدد ${M(a)}.`,{lv:2})};
function opText(a,b,op){return M(a+(op==='+'?' + ':' − ')+b)}
function qOpMC(R,op){return()=>{let a,b,c;
  if(op==='+'){[a,b]=pairs(R);c=a+b}else{[a,b]=subp(R);c=a-b}
  const calc=(x,y)=>op==='+'?x+y:x-y,ok=opText(a,b,op),W=[];let t=0;
  while(W.length<3&&t++<200){const x=op==='+'?rnd(R.a[0],R.a[1]):rnd(R.t[0],R.t[1]),y=rnd(R.b[0],R.b[1]);if(op==='-'&&y>x)continue;const v=calc(x,y);if(v===c||(op==='+'&&(v<R.s[0]||v>R.s[1])))continue;const s=opText(x,y,op);if(s!==ok&&!W.includes(s))W.push(s)}
  return mcs(ok,W,`أيّ عملية ناتجها ${M(c)}؟`,`${M(a+(op==='+'?' + ':' − ')+b+' = '+c)}، أما غيرها فناتجها مختلف.`,{lv:2})}}
const qErr=(R,op)=>()=>{let a,b,s;if(op==='+'){[a,b]=pairs(R);s=a+b}else{[a,b]=subp(R);s=a-b}
  const x=s+(Math.random()<.5?1:-1)||s+1,nm=pick(NMS),sg=op==='+'?' + ':' − ';
  const W=['نعم، الناتج صحيح',`لا، الناتج الصحيح ${M(s+1===x?s+2:s+1)}`,`لا، الناتج الصحيح ${M(s-1===x||s-1<0?s+3:s-1)}`];
  return mcs(`لا، الناتج الصحيح ${M(s)}`,W,`${V(nm,'قال','قالت')} ${nm[0]}: ${M(a+sg+b+' = '+x)}. هل ${V(nm,'هو محق','هي محقة')}؟`,`${M(a+sg+b+' = '+s)}، فالناتج ${M(x)} خطأ.`,{lv:2})};
const qCmp=(R,op)=>()=>{let a,b,c,d,s1,s2,t=0;
  do{if(op==='+'){[a,b]=pairs(R);[c,d]=pairs(R)}else{[a,b]=subp(R);[c,d]=subp(R)}s1=op==='+'?a+b:a-b;s2=op==='+'?c+d:c-d;t++}while((s1===s2||(a===c&&b===d))&&t<100);
  const e1=opText(a,b,op),e2=opText(c,d,op);
  return mcs(s1>s2?e1:e2,[s1>s2?e2:e1,'ناتجهما متساويان','لا نعرف'],`أيّ العمليتين ناتجها أكبر؟`,`${e1} = ${M(s1)} و ${e2} = ${M(s2)}، لذلك الأكبر ${s1>s2?e1:e2}.`,{lv:2,k:e1+e2})};
const qSeq=(lo,hi,dir)=>()=>{const a=rnd(lo,hi),h=rnd(0,2);const L=dir>0?[a,a+1,a+2,a+3]:[a+3,a+2,a+1,a];const ans=L[h+1>3?1:h+1];const sh=L.map((v,i)=>i===(h+1>3?1:h+1)?'?':v).join(' ، ');
  return N(ans,`أكمل العدّ ${dir>0?'إلى الأمام':'إلى الخلف'}: ${M(sh)}`,`العدد الناقص ${M(ans)}.`,{lv:1,k:sh})};
const qNext=(lo,hi)=>()=>{const a=rnd(lo,hi);return N(a+1,`ما العدد الذي يأتي بعد ${M(a)}؟`,`بعد ${M(a)} نقول ${M(a+1)}.`,{lv:1})};
const qPrev=(lo,hi)=>()=>{const a=rnd(lo,hi);return N(a-1,`ما العدد الذي يأتي قبل ${M(a)}؟`,`قبل ${M(a)} نقول ${M(a-1)}.`,{lv:1})};
const qBetween=(lo,hi)=>()=>{const a=rnd(lo,hi);return N(a+1,`ما العدد الذي بين ${M(a)} و ${M(a+2)}؟`,`${M(a+' ، '+(a+1)+' ، '+(a+2))}، فالعدد ${M(a+1)}.`,{lv:2})};
function distinct(k,lo,hi){const s=new Set();while(s.size<k)s.add(rnd(lo,hi));return[...s]}
const qMax=(lo,hi)=>()=>{const L=distinct(4,lo,hi),m=Math.max(...L);return mcs(M(m),L.filter(v=>v!==m).map(v=>M(v)),'أيّ عدد هو الأكبر؟',`${M(m)} يأتي متأخراً في العدّ، فهو الأكبر.`,{lv:1,k:L.join()})};
const qMin=(lo,hi)=>()=>{const L=distinct(4,lo,hi),m=Math.min(...L);return mcs(M(m),L.filter(v=>v!==m).map(v=>M(v)),'أيّ عدد هو الأصغر؟',`${M(m)} يأتي مبكراً في العدّ، فهو الأصغر.`,{lv:1,k:L.join()})};
const qOrder=(lo,hi,desc)=>()=>{const L=distinct(3,lo,hi),A=L.slice().sort((x,y)=>x-y),D=A.slice().reverse();const f=l=>M(l.join(' ، '));

function two(){const a=pick(NMS);let b;do{b=pick(NMS)}while(b[0]===a[0]);return[a,b]}
const WK={
 join(R,c){const[A,B]=pairs(R),n=pick(NMS);return{ans:A+B,t:`${c.loc} ${cnt(A,c)}. ${V(n,c.am,c.af)} ${n[0]} ${cnt(B,c,1)} أيضاً. كم ${c.a} صار ${c.loc}؟`,sol:`${M(A+' + '+B+' = '+(A+B))}.`}},
 sep(R,c){const[A,B]=subp(R),n=pick(NMS);return{ans:A-B,t:`${c.loc} ${cnt(A,c)}. ${V(n,c.rm,c.rf)} ${n[0]} منها ${cnt(B,c,1)}. كم ${c.a} بقي ${c.loc}؟`,sol:`${M(A+' − '+B+' = '+(A-B))}.`}},
 findAdd(R,c){const[A,B]=pairs(R),n=pick(NMS);return{ans:B,t:`${c.loc} ${cnt(A,c)}. ${V(n,c.am,c.af)} ${n[0]} عدداً آخر فصار ${c.loc} ${cnt(A+B,c)}. كم ${c.a} ${V(n,c.am,c.af)} ${n[0]}؟`,sol:`${M((A+B)+' − '+A+' = '+B)}، ونتأكد: ${M(A+' + '+B+' = '+(A+B))}.`}},
 findStart(R,c){const[A,B]=pairs(R),n=pick(NMS);return{ans:A,t:`${c.loc} ${c.p}. ${V(n,c.am,c.af)} ${n[0]} ${cnt(B,c,1)} فصار ${c.loc} ${cnt(A+B,c)}. كم ${c.a} كان ${c.loc} في البداية؟`,sol:`${M((A+B)+' − '+B+' = '+A)}، ونتأكد: ${M(A+' + '+B+' = '+(A+B))}.`}},
 total2(R,c){const[A,B]=pairs(R),[n1,n2]=two();return{ans:A+B,t:`عند ${n1[0]} ${cnt(A,c)} وعند ${n2[0]} ${cnt(B,c)}. كم ${c.a} عندهما معاً؟`,sol:`${M(A+' + '+B+' = '+(A+B))}.`}},
 ten(R,c){const B=rnd(R.b[0],R.b[1]),[n1,n2]=two();return{ans:10+B,t:`عند ${n1[0]} 10 ${c.p} وعند ${n2[0]} ${cnt(B,c)}. كم ${c.a} عندهما معاً؟`,sol:`${M('10 + '+B+' = '+(10+B))}.`}},
 dbl(R,c){const A=rnd(R.a[0],R.a[1]),[n1,n2]=two();return{ans:2*A,t:`عند ${n1[0]} ${cnt(A,c)} وعند ${n2[0]} العدد نفسه. كم ${c.a} عندهما معاً؟`,sol:`${M(A+' + '+A+' = '+2*A)}.`}},
 dbl2(R,c){const A=rnd(R.a[0],R.a[1]),[n1,n2]=two();return{ans:2*A,t:`عند ${n1[0]} ${cnt(A,c)} وعند ${n2[0]} ${cnt(A,c)}. كم ${c.a} عندهما معاً؟`,sol:`${M(A+' + '+A+' = '+2*A)}.`}},
 near(R,c){const A=rnd(R.a[0],R.a[1]),B=Math.random()<.5?A+1:A-1,[n1,n2]=two();return{ans:A+B,t:`عند ${n1[0]} ${cnt(A,c)} وعند ${n2[0]} ${cnt(B,c)}. كم ${c.a} عندهما معاً؟`,sol:`${M(A+' + '+A+' = '+2*A)} ثم ${B>A?'نزيد':'ننقص'} ${M(1)}: ${M(A+' + '+B+' = '+(A+B))}.`}},
 need10(R,c){const A=rnd(R.a[0],R.a[1]),n=pick(NMS);return{ans:10-A,t:`عند ${n[0]} ${cnt(A,c)}. كم ${c.a} ${V(n,'يحتاج','تحتاج')} ${n[0]} ليصير ${V(n,'عنده','عندها')} 10 ${c.p}؟`,sol:`${M(A+' + '+(10-A)+' = 10')}، إذن ${M(10-A)}.`}},
 compare(R,c){let A,B;do{[A,B]=[rnd(R.t[0],R.t[1]),rnd(R.b[0],R.b[1])]}while(A<=B||(R.cross&&B<=A-10));const[n1,n2]=two();return{ans:A-B,t:`عند ${n1[0]} ${cnt(A,c)} وعند ${n2[0]} ${cnt(B,c)}. كم ${c.a} أكثر عند ${n1[0]} من ${n2[0]}؟`,sol:`${M(A+' − '+B+' = '+(A-B))}.`}},
 more(R,c,fewer){let A,B;do{A=rnd(R.t[0],R.t[1]);B=rnd(R.t[0],R.t[1])}while(A===B);const[n1,n2]=two();const ok=fewer?(A<B?n1[0]:n2[0]):(A>B?n1[0]:n2[0]);
   return{mc:1,ok,wr:[fewer?(A<B?n2[0]:n1[0]):(A>B?n2[0]:n1[0]),'عددهما متساوٍ','لا نعرف'],t:`عند ${n1[0]} ${cnt(A,c)} وعند ${n2[0]} ${cnt(B,c)}. من عنده ${c.p} ${fewer?'أقل':'أكثر'}؟`,sol:`نقارن ${M(A)} و ${M(B)}: ${A>B?M(A)+' أكبر':M(B)+' أكبر'}، فمن عنده ${fewer?'أقل':'أكثر'} هو ${ok}.`}},
 fewer(R,c){return WK.more(R,c,1)},
 same(R,c){const eq=Math.random()<.5;const A=rnd(R.t[0],R.t[1]);let B=eq?A:rnd(R.t[0],R.t[1]);if(!eq&&B===A)B=A===R.t[1]?A-1:A+1;const[n1,n2]=two();
   const ok=A===B?'نعم، العددان متساويان':(A>B?`لا، عند ${n1[0]} أكثر`:`لا، عند ${n2[0]} أكثر`);
   return{mc:1,ok,wr:['نعم، العددان متساويان',`لا، عند ${n1[0]} أكثر`,`لا، عند ${n2[0]} أكثر`,'لا نعرف'],t:`عند ${n1[0]} ${cnt(A,c)} وعند ${n2[0]} ${cnt(B,c)}. هل عندهما العدد نفسه؟`,sol:`${M(A)} و ${M(B)}: ${A===B?'العددان نفسهما':A>B?M(A)+' أكبر من '+M(B):M(B)+' أكبر من '+M(A)}.`}},
 seq(R,c){const A=rnd(R.t[0],R.t[1]-3),n=pick(NMS);return{ans:A+3,t:`${V(n,'يعدّ','تعدّ')} ${n[0]}: ${M(A+' ، '+(A+1)+' ، '+(A+2))}. ما العدد التالي؟`,sol:`بعد ${M(A+2)} نقول ${M(A+3)}.`}}
};
let wq=[];
function genWords(kinds,R,k){
  while(wq.length<k)wq=wq.concat(shuf(CXS.map((_,i)=>i)));
  const off=rnd(0,kinds.length-1),out=[],seen=new Set();
  for(let j=0;j<k;j++){let o,t=0;const kind=kinds[(j+off)%kinds.length];
    do{const c=CXS[wq[0]];o=WK[kind](R,c);t++}while(seen.has(o.t)&&t<20);seen.add(o.t);wq.shift();
    if(o.mc)out.push(mcs(o.ok,o.wr,o.t,o.sol,{lv:2}));else out.push(N(o.ans,o.t,o.sol,{lv:2}))}
  return shuf(out)}

const SHP=['circle','sq','tri','star'],COLS=[CB,CO,CS];
function one(x,y,sh,c){
  if(sh==='sq')return `<rect x="${x-12}" y="${y-12}" width="24" height="24" rx="4" fill="${c}" stroke="${CN}" stroke-width="2"/>`;
  if(sh==='tri')return `<polygon points="${x},${y-14} ${x-14},${y+11} ${x+14},${y+11}" fill="${c}" stroke="${CN}" stroke-width="2" stroke-linejoin="round"/>`;
  if(sh==='star'){let p=[];for(let i=0;i<10;i++){const r=i%2?6:14,a=-Math.PI/2+i*Math.PI/5;p.push((x+r*Math.cos(a)).toFixed(1)+','+(y+r*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${c}" stroke="${CN}" stroke-width="2" stroke-linejoin="round"/>`}
  return circ(x,y,13,c)}
function gbox(n,sh,col,x0,y0){const rows=Math.max(1,Math.ceil(n/5)),w=5*32+12,h=rows*32+12;
  let b=`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="10" fill="#fff" stroke="${CB}" stroke-width="3"${n===0?' stroke-dasharray="7 6"':''}/>`;
  for(let i=0;i<n;i++)b+=one(x0+22+(i%5)*32,y0+22+Math.floor(i/5)*32,sh,col);return{b,w,h}}
function grp(n,sh,col){const o=gbox(n,sh,col,4,4);return svg(o.w+8,o.h+8,o.b)}
/* مجموعات متجاورة؛ الأولى من اليمين وتحت كل مجموعة حرفها */
const LET=['أ','ب','ج'];
function groups(L,lab){const W=5*32+12,G=14,n=L.length;let b='',H=0;
  L.forEach((g,i)=>{const x=6+(n-1-i)*(W+G),o=gbox(g.n,g.sh,g.col,x,6);b+=o.b;H=Math.max(H,o.h);g._c=x+W/2});
  if(lab)L.forEach((g,i)=>{b+=txt(g._c,H+34,LET[i],22,CO)});
  return svg(6+n*(W+G),H+(lab?44:12),b)}
function strip(total,k){const s=34;let b='';for(let i=0;i<total;i++)b+=`<rect x="${6+i*(s+4)}" y="6" width="${s}" height="${s}" rx="5" fill="${i<k?CO:'#fff'}" stroke="${CN}" stroke-width="2.5"/>`;return svg(12+total*(s+4),46,b)}
function hid(total,vis){const s=34;let b='';for(let i=0;i<total;i++){const x=6+i*(s+4);
  b+=i<vis?`<rect x="${x}" y="6" width="${s}" height="${s}" rx="5" fill="${CB}" stroke="${CN}" stroke-width="2.5"/>`:`<rect x="${x}" y="6" width="${s}" height="${s}" rx="5" fill="${CC}" stroke="${CO}" stroke-width="2.5" stroke-dasharray="5 4"/>${txt(x+s/2,31,'؟',22,CO)}`}return svg(12+total*(s+4),46,b)}

const spread=(a,n)=>{const L=a.length;if(L<=n)return a.slice();const o=[];for(let i=0;i<n;i++)o.push(a[Math.round(i*(L-1)/(n-1))]);return o};
function LES2(o){const L={id:o.id,name:o.name,ax:AXES[o.ax],boxes:[GOAL(GOALS[o.id])].concat(o.boxes),ins:o.ins};
  const idx=()=>TOPICS.indexOf(L);
  L.gen=()=>{const rg=ST(idx()).b.rg,f=()=>spread(o.bank(),5);return rg?f():withSeed('g'+o.id,f)};
  L.wgen=()=>{const rg=ST(idx()).w.rg,f=()=>{wq=[];return o.words().slice(0,5)};return rg?f():withSeed('w'+o.id,f)};
  L.exam=()=>{const f=()=>{wq=[];const bank=o.bank(),w=o.words();const a=spread(bank.slice(0,bank.length-3),4).concat(w.slice(0,1));a.sort((x,y)=>(x.lv||2)-(y.lv||2));
    a.ch=bank.slice(-4).reverse().find(q=>q.type!=='vm'&&!a.some(z=>plain(z.t)===plain(q.t)))||bank.filter(q=>q.type!=='vm').pop();return a};
    const S=ST(idx());return (S.xn||S.xs)?f():withSeed('x'+o.id,f)};
  return L}
const mk=o=>LES2({id:o.id,name:o.name,ax:o.ax,boxes:o.boxes,ins:o.ins,bank:o.gen,words:o.wgen});

const O=(q,opts,why)=>({q,opts,why});
const X=(f,n)=>Array(n).fill(f);
const trees=a=>`<div class="trees g">${a.join('')}</div>`;
const CSZ=22;
function mini(n,x,y,col){const w=n*CSZ+8,h=CSZ+8;
  let b=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#fff" stroke="${CB}" stroke-width="2.5"/>`;
  for(let i=0;i<n;i++)b+=circ(x+4+CSZ/2+i*CSZ,y+4+CSZ/2,9,col);return{b,w,h}}
/* شجرة بالرسم: الكل فوق ومجموعتان جنب بعض في صف واحد بدوائر متساوية؛ hide = 'a' أو 'b' أو 'w' */
function treeP(w,a,b,hide){const W=Math.max(190,CSZ*w+70),A=mini(a,0,0,CB),B=mini(b,0,0,CO),gap=26,tot=A.w+B.w+gap,x0=(W-tot)/2,y0=92,ny=y0+CSZ+8+30;
  const ac=x0+A.w/2,bc=x0+A.w+gap+B.w/2,cx=W/2;
  let s=`<line x1="${cx}" y1="48" x2="${ac}" y2="${y0-4}" stroke="${CN}" stroke-width="3"/><line x1="${cx}" y1="48" x2="${bc}" y2="${y0-4}" stroke="${CN}" stroke-width="3"/>`+circ(cx,26,23,hide==='w'?'#fff':CB)+txt(cx,36,hide==='w'?'?':w,hide==='w'?28:26,hide==='w'?CO:'#fff');
  s+=mini(a,x0,y0,CB).b+mini(b,x0+A.w+gap,y0,CO).b;
  s+=txt(ac,ny,hide==='a'?'?':a,30,hide==='a'?CO:CN)+txt(bc,ny,hide==='b'?'?':b,30,hide==='b'?CO:CN);
  const eq=(hide==='a'?'?':a)+' + '+(hide==='b'?'?':b)+' = '+(hide==='w'?'?':w);
  s+=txt(cx,ny+38,'\u202D'+eq+'\u202C',26,CN);return svg(W,ny+50,s)}
/* شجرة بالأرقام فقط */
function treeN(w,a,b,hide){const c=(x,y,v,f)=>circ(x,y,26,v==='?'?'#fff':f)+txt(x,y+9,v,v==='?'?28:26,v==='?'?CO:'#fff');
  const eq=(hide==='a'?'?':a)+' + '+(hide==='b'?'?':b)+' = '+(hide==='w'?'?':w);
  return svg(190,190,`<line x1="95" y1="52" x2="48" y2="92" stroke="${CN}" stroke-width="3"/><line x1="95" y1="52" x2="142" y2="92" stroke="${CN}" stroke-width="3"/>`+c(95,28,hide==='w'?'?':w,CB)+c(48,118,hide==='a'?'?':a,CB)+c(142,118,hide==='b'?'?':b,CO)+txt(95,178,'\u202D'+eq+'\u202C',24,CN))}
const pairsOf=w=>{const L=[];for(let a=1;a<=w/2;a++)L.push([a,w-a]);return L};
function numCard(n,i){const sh=SHP[i%4],col=[CB,CO,CSZ][i%3],o=gbox(n,sh,col,4,4);return svg(o.w+8,o.h+54,o.b+txt(o.w/2+4,o.h+46,n,40,CN))}

function insFor(ws){return withSeed('ins'+ws.join(),()=>{const w0=ws[0],w=ws[ws.length-1],o=[];
  const wrong=(ww,n)=>{const W=[];let t=0;while(W.length<n&&t++<400){const x=rnd(1,ww),y=rnd(1,ww);if(x+y!==ww){const s=x+' + '+y;if(!W.includes(s))W.push(s)}}return W};
  const near=(v,hi)=>{const W=[];for(let d=1;W.length<3&&d<12;d++){[v+d,v-d].forEach(x=>{if(x>=0&&x<=hi&&x!==v&&!W.includes(String(x))&&W.length<3)W.push(String(x))})}return W};
  let p=rnd(1,w0-1);o.push({q:`أيّ جمع ناتجه العدد ${w0}؟`,opts:[p+' + '+(w0-p)].concat(wrong(w0,3)),why:`${p} + ${w0-p} = ${w0}.`});
  p=rnd(1,w-1);o.push({q:`العدد ${w} يتكوّن من ${p} + ... ؟`,opts:[String(w-p)].concat(near(w-p,w)),why:`${p} + ${w-p} = ${w}.`});
  const bd=wrong(w,1)[0];o.push({q:`أيّ جمع ناتجه ليس العدد ${w}؟`,opts:[bd].concat(pairsOf(w).slice(0,3).map(([x,y])=>x+' + '+y)),why:`${bd} لا يساوي ${w}.`});
  p=rnd(1,w-1);o.push({q:`عندنا ${w} مكعبات: ${p} منها زرقاء والباقي برتقالي. كم مكعباً برتقالياً؟`,opts:[String(w-p)].concat(near(w-p,w)),why:`${p} + ${w-p} = ${w}.`});
  p=rnd(1,w-1);const q=(w-p+1<=w?w-p+1:w-p-1);o.push({q:`قال سامر: ${p} + ${q} = ${w}. هل هو محق؟`,opts:[`لا، لأن ${p} + ${q} = ${p+q}`,`نعم، لأن ${p} + ${q} = ${w}`,'نعم، لأن العددين أصغر منه','لا، لأن الجمع لا يكوّن العدد'],why:`${p} + ${q} = ${p+q} وليس ${w}.`});
  p=rnd(1,w-1);o.push({q:`هل ${p} + ${w-p} و ${w-p} + ${p} يكوّنان العدد نفسه؟`,opts:['نعم، نبدّل مكان الجزأين فقط',`لا، الأول يعطي ${w} والثاني لا`,'لا، لأن الأعداد مختلفة','لا نعرف'],why:`${p} + ${w-p} = ${w-p} + ${p} = ${w}.`});

function insState(tk,T){if(!store[tk+':ins'])store[tk+':ins']={ord:T.ins.map(q=>shuf(q.opts.map((_,i)=>i))),ans:{}};return store[tk+':ins']}
function insHTML(T,tk){
  const S=insState(tk,T),n=T.ins.length,done=Object.keys(S.ans).filter(k=>+k<n).length;
  let ok=0;T.ins.forEach((q,i)=>{if(S.ans[i]===0)ok++});
  const fx=t=>/<span/.test(t)?t:t.replace(/\d+(?:\s*[×+−÷=]\s*\d+)*/g,'<span class="m">$&</span>');
  let h=`<div class="ltitle"><h2>اختبر استيعابك</h2></div>`;
  T.ins.forEach((q,i)=>{
    const a=S.ans[i],ord=S.ord[i],sl=(S.sel||{})[i];
    h+=`<div class="q iq" data-iq="${i}"><div class="qh"><div class="qn">${i+1}</div><div class="qt">${fx(q.q)}</div></div><div class="opts ${optCls(q.opts)}">`+ord.map(j=>{
      let cls='opt';if(a!==undefined){if(j===0)cls+=' ok';else if(a===j)cls+=' no'}else if(sl===j)cls+=' sel'
      return `<button class="${cls}" data-iq="${i}" data-j="${j}"${a!==undefined?' disabled':''}>${fx(q.opts[j])}</button>`}).join('')+'</div>';
    if(a!==undefined)h+=`<div class="why"><b>${a===0?'✓ صحيح':a===99?'الحل':'✗ خطأ'}</b> · ${fx(q.why)}</div>`;else h+=`<div class="ans"><span class="fb"></span><button class="btn ck" data-ick="${i}">تحقق</button><button class="btn sky" data-ishow="${i}">عرض الحل</button></div>`;
    h+='</div>'});
  if(done===n)h+=`<div class="resdash"><h3>${ok} من ${n}</h3></div>`;if(done>0)h+=`<div class="rbar"><button class="btn rs" id="insreset">↻ أعد المحاولة بأسئلة الشرح</button></div>`;
  return h;
}

function vmSol(a,n){const A=String(a);let c=0,out=[];for(let i=A.length-1;i>=0;i--){const d=+A[i],v=d*n+c,cr=Math.floor(v/10);let s=M(d+'×'+n+'='+d*n)+(c?' ثم '+M(d*n+'+'+c+'='+v):'');s+=i>0?`: نكتب ${v%10}`+(cr?` ونحمل ${cr}`:''):`: نكتب ${v}`;out.push(s);c=cr}return out.join('. ')+`. الناتج <b>${a*n}</b>.`}
function pickUniq(lo,hi,used){let x,t=0;do{x=rnd(lo,hi)}while(used.has(x)&&++t<40);used.add(x);return x}
const seenPool={};
function pickFresh(key,pool,k){const u=seenPool[key]=seenPool[key]||new Set();let f=pool.map((_,i)=>i).filter(i=>!u.has(i));if(f.length<k){u.clear();f=pool.map((_,i)=>i)}const pick=shuf(f).slice(0,k);pick.forEach(i=>u.add(i));return pick.map(i=>pool[i])}

function doSend(){

 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||p.closest('.m,.ltr,svg,script,style,input,textarea,.vmx,.vm'))return NodeFilter.FILTER_REJECT;return /\d/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
 const L=[];while(w.nextNode())L.push(w.currentNode);
 L.forEach(n=>{const t=n.nodeValue;RX.lastIndex=0;let m,last=0;const f=document.createDocumentFragment();
  while((m=RX.exec(t))){let x=m[0].replace(/[\s:،,.]+$/,'');if(!x)continue;const i=m.index;
   if(i>last)f.append(t.slice(last,i));const sp=document.createElement('span');sp.className='ltr';sp.textContent=x;f.append(sp);last=i+x.length;RX.lastIndex=last}

 busy=false;obs.observe(root,{childList:true,subtree:true})}

  document.body.appendChild(o);const i=o.querySelector('#nmin');if(store.sname)i.value=store.sname;
  const go=()=>{const v=i.value.trim();if(v.length<2){o.querySelector('#nmer').textContent='اكتب اسمك من فضلك';return}setPName(v);o.remove()};
  o.querySelector('#nmgo').onclick=go;i.addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>i.focus(),50)}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='chname')askName(true)});
(function(){const c=document.getElementById('app');
  const ins=()=>{const cv=document.querySelector('.hero.cov');if(cv&&!document.getElementById('namechip')){const d=document.createElement('div');d.id='namechip';d.className='namechip';cv.appendChild(d);chip()}};
  new MutationObserver(ins).observe(c,{childList:true,subtree:true});ins()})();
if(store.sname&&!store.pname)store.pname=store.sname;
askName();
/* ===== زر الصوت (عربي) وتلميح ملء الشاشة ===== */
(function(){
const UN=['صفر','وَاحِد','اِثْنَان','ثَلَاثَة','أَرْبَعَة','خَمْسَة','سِتَّة','سَبْعَة','ثَمَانِيَة','تِسْعَة','عَشَرَة','أَحَدَ عَشَر','اِثْنَا عَشَر','ثَلَاثَةَ عَشَر','أَرْبَعَةَ عَشَر','خَمْسَةَ عَشَر','سِتَّةَ عَشَر','سَبْعَةَ عَشَر','ثَمَانِيَةَ عَشَر','تِسْعَةَ عَشَر'];
const TN=['','','عِشْرُون','ثَلَاثُون','أَرْبَعُون','خَمْسُون','سِتُّون','سَبْعُون','ثَمَانُون','تِسْعُون'];
function arNum(n){n=+n;if(n<20)return UN[n];if(n<100){const o=n%10,t=Math.floor(n/10);return o?UN[o]+' وَ'+TN[t]:TN[t]}if(n<1000){const h=Math.floor(n/100),r=n%100,hw=h===1?'مِئَة':h===2?'مِئَتَان':UN[h]+'مِئَة';return r?hw+' وَ'+arNum(r):hw}return String(n)}
const SAYW={'كم':'كَمْ','ناتج':'نَاتِجُ','أكمل':'أَكْمِلْ','اكتب':'اُكْتُبْ','أجب':'أَجِبْ','اختر':'اِخْتَرْ','رتّب':'رَتِّبْ'};
function sayText(s){s=s.replace(/🔊|■|⭐/g,' ').replace(/[−–]\s*(?=[\d?])/g,' نَاقِص ').replace(/\+/g,' زَائِد ').replace(/=/g,' يُسَاوِي ').replace(/\?/g,' كَمْ ').replace(/×/g,' ضَرْب ').replace(/÷/g,' مَقْسُومٌ عَلَى ').replace(/\d+/g,m=>' '+arNum(m)+' ');
  return s.replace(/\s+/g,' ').split(' ').map(w=>SAYW[w]||w).join(' ').replace(/[,،]/g,' ، ')}
let cur=null;
function toast(m){let el=document.getElementById('lockmsg');if(!el){el=document.createElement('div');el.id='lockmsg';document.body.appendChild(el)}el.textContent=m;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),4000)}
function stop(){try{speechSynthesis.cancel()}catch(x){}if(cur){cur.classList.remove('on');cur.textContent='🔊';cur=null}}
function speak(btn,text){
  if(!('speechSynthesis' in window)){toast('هذا المتصفح لا يدعم قراءة الصوت');return}
  if(cur===btn){stop();return}
  stop();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.85;
  const V=speechSynthesis.getVoices(),v=V.find(x=>/^ar/i.test(x.lang));if(v)u.voice=v;else if(V.length)toast('لا يوجد صوت عربي على هذا الجهاز');
  u.onend=u.onerror=()=>{if(cur===btn)stop()};cur=btn;btn.classList.add('on');btn.textContent='■';speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const b=e.target.closest('.snd');if(!b)return;e.stopPropagation();
  const q=b.closest('.q'),bx=b.closest('.box');let s='';
  if(q){s=(q.querySelector('.qt')||{}).innerText||'';const L=['أ','ب','ج','د'];q.querySelectorAll('.opt').forEach((o,i)=>{s+=' ، '+L[i]+' ، '+o.innerText})}
  else if(bx){const bb=bx.querySelector('.bb');s=((bx.querySelector('.bh h2')||{}).innerText||'')+' . '+(bb?bb.innerText:'')}
  speak(b,sayText(s))},true);
function addBtns(){document.querySelectorAll('#content .qh,#content .bh').forEach(h=>{if(!h.querySelector('.snd')){const b=document.createElement('button');b.type='button';b.className='snd';b.textContent='🔊';b.setAttribute('aria-label','قراءة بالصوت');h.appendChild(b)}})}
let tm;new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(addBtns,40)}).observe(document.getElementById('app'),{childList:true,subtree:true});addBtns();
const fsb2=document.getElementById('fsb');
if(fsb2&&fsb2.style.display!=='none'){const h=document.createElement('div');h.className='fsh';h.textContent='◀ اضغط هنا لملء الشاشة وتجربة أفضل';document.body.appendChild(h);const rm=()=>h.remove();setTimeout(rm,12000);fsb2.addEventListener('click',rm)}
})();

</script>
